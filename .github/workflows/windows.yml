name: Windows desktop validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Install Qt SDK
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP/Qt" --archives qtbase qtdeclarative qtsvg qttools --modules qtshadertools qtimageformats
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure complete desktop app
        run: cmake --preset release "-DCMAKE_PREFIX_PATH=$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64"
      - name: Build
        run: cmake --build --preset release --parallel 4
      - name: Test
        run: ctest --preset release --output-on-failure
      - name: Package
        run: cmake --build --preset package-release
      - name: Verify deployed app with isolated data
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QUICK_BACKEND = 'software'
          $env:QT_QPA_FONTDIR = "$env:WINDIR/Fonts"
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $process = Start-Process -FilePath './out/package/NookBit-Release/nookbit.exe' -ArgumentList '--verify-ui' -Wait -PassThru -WindowStyle Hidden -RedirectStandardOutput "$env:RUNNER_TEMP/nookbit-smoke.log" -RedirectStandardError "$env:RUNNER_TEMP/nookbit-smoke-error.log"
          Get-Content "$env:RUNNER_TEMP/nookbit-smoke.log", "$env:RUNNER_TEMP/nookbit-smoke-error.log"
          exit $process.ExitCode
